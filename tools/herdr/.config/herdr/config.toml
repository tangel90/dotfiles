onboarding = false

[ui.toast]
delivery = "herdr"         # in-app toasts, so prefix+shift+o can jump to them

[ui]
tab_bar_position = "bottom"
status_indicators = "symbols"
# Claude usage, cached by the claude status line (see hlimits)
tab_bar_right_separator = " · "
tab_bar_right = [
  { type = "command", command = "~/.local/bin/hlimits", interval_seconds = 10, timeout_seconds = 2 },
  { type = "datetime", format = "%H:%M" },
]
prompt_new_tab_name = false  # prefix+t opens the tab straight away
confirm_close = false        # closing the last pane closes the workspace without asking
# On WSL "auto" draws herdr's own steady block cursor, dropping the pane's
# cursor shape (nvim's insert-mode bar). Native passes it to the terminal; may
# bring back occasional cursor flicker during heavy output.
host_cursor = "native"
show_agent_labels_on_pane_borders = true  # agent name on split pane borders, unless the pane has a manual label

# Claude agents: name, then workspace and context use ($ctx, reported by
# statusline-command.sh; its $model is left out as noise). No tab: ha labels
# each agent's tab with its name, so it would repeat the agent.
# $ctx is dim, gold from 50%, love (red) from 80%. It reads "42%", which
# numeric rules reject, so the bands match on text: single digits ("5%".."9%")
# first, keeping the default, before the leading-digit rules could catch them.
[ui.sidebar.agents.rows_by_agent]
claude = [
  ["state_icon", "pane"],   # pane label = herdr agent name, set by ha
  ["machine", { token = "workspace", dim = true }, { token = "$ctx", dim = true, rules = [
    { equals = "100%", fg = "#eb6f92", dim = false },
    { equals = "5%" }, { equals = "6%" }, { equals = "7%" }, { equals = "8%" }, { equals = "9%" },
    { starts_with = "9", fg = "#eb6f92", dim = false },
    { starts_with = "8", fg = "#eb6f92", dim = false },
    { starts_with = "7", fg = "#f6c177", dim = false },
    { starts_with = "6", fg = "#f6c177", dim = false },
    { starts_with = "5", fg = "#f6c177", dim = false },
  ] }],
]

[theme]
name = "rose-pine"
auto_switch = false

# Mirrors nvim/.config/nvim/lua/config/palette.lua (main)
[theme.custom]
panel_bg = "#282C34"       # base
sidebar_bg = "#282C34"     # base
surface_dim = "#2C313A"    # surface
active_row_bg = "#353B45"  # overlay
selection_bg = "#403d52"   # highlight_med
text = "#e0def4"
surface0 = "#2C313A"       # surface
surface1 = "#353B45"       # overlay
overlay0 = "#c8c6dc"       # dim labels ("agents", "new", "menu")
overlay1 = "#d4d2e6"
subtext0 = "#dcdaec"
accent = "#fbbcba"         # rose
mauve = "#a4a7e7"          # iris
green = "#9ccfd8"          # foam (idle dots; leaf #95b1ac was too dim)
yellow = "#f6c177"         # gold
red = "#eb6f92"            # love
peach = "#ffaa88"
blue = "#9ccfd8"           # foam  (catppuccin-like branch highlight)
teal = "#9ccfd8"           # foam

[keys]
prefix = "ctrl+k"
close_pane = "prefix+q"     # match tmux kill-pane
detach = "prefix+d"         # match tmux; default was prefix+q
new_tab = "prefix+t"        # default was prefix+c
next_tab = ["prefix+n", "alt+right"]   # alt+left/right: no prefix needed
previous_tab = "alt+left"                # prefix+p is open-pass, as in tmux
rename_pane = "prefix+ctrl+p"            # prefix+shift+p is open-pass show
next_workspace = "alt+down"          # alt+down/up: workspaces, pairs with alt+left/right tabs
previous_workspace = "alt+up"
switch_tab = ["prefix+1..9", "alt+1..9"]   # prefix+1..9 is the default; alt+ pairs with alt+left/right
next_agent = "prefix+alt+n"
previous_agent = "prefix+alt+p"
open_notification_target = []                 # prefix+a runs hlast instead (works after the toast is gone), prefix+o hnvim
split_vertical = "prefix+shift+v"            # prefix+v runs hsplit (split + hcouple)
cycle_pane_next = []                         # was prefix+tab, now last tab (plugins/last-tab); prefix+shift+tab still cycles
clear_pane = "prefix+ctrl+r"                # wipe screen + scrollback, e.g. after a secret was shown
copy_mode = "prefix+f"                       # default was prefix+[
edit_scrollback = "prefix+shift+e"           # prefix+e runs yazi
# prefix+w picker: j/k move between workspaces, J/K between panes (h/l unchanged)
navigate_workspace_down = "j"
navigate_workspace_up = "k"
navigate_pane_down = "shift+j"
navigate_pane_up = "shift+k"

[[keys.command]]
key = "prefix+m"
type = "shell"
command = "\"$HOME/.local/bin/hbreak\""
description = "move pane to new tab"

[[keys.command]]
key = "prefix+a"
type = "shell"
command = "\"$HOME/.local/bin/hlast\""
description = "focus agent that finished last / needs input"

[[keys.command]]
key = "prefix+i"
type = "popup"
command = "cd \"${HERDR_ACTIVE_PANE_CWD:-$HOME}\" && exec lazygit"
description = "lazygit in the pane's directory"
width = "90%"
height = "85%"

[[keys.command]]
key = "prefix+e"            # replaces edit_scrollback, now prefix+shift+e
type = "popup"
command = "cd \"${HERDR_ACTIVE_PANE_CWD:-$HOME}\" && exec yazi"
description = "yazi in the pane's directory"
width = "90%"
height = "85%"

[[keys.command]]
key = "prefix+ctrl+w"
type = "popup"
command = "\"$HOME/.local/bin/hw\" --here"
description = "open a file below the pane's directory in a new tab (hw)"
width = "90%"
height = "85%"

[[keys.command]]
key = "prefix+alt+w"
type = "popup"
command = "\"$HOME/.local/bin/hw\""
description = "open any file under ~ in a new tab (hw)"
width = "90%"
height = "85%"

[[keys.command]]
key = "prefix+shift+a"
type = "popup"
command = "\"$HOME/.local/bin/hagent\""
description = "start a Claude subagent definition as an agent in a new tab (hagent)"
width = "90%"
height = "85%"

[[keys.command]]
key = "prefix+shift+o"      # was open_notification_target; prefix+s is herdr's Settings again
type = "popup"
command = "\"$HOME/.local/bin/hp\""
description = "project picker: workspaces, chats, folders"
width = "90%"
height = "85%"

[[keys.command]]
key = "prefix+v"            # replaces split_vertical, now prefix+shift+v
type = "shell"
command = "\"$HOME/.local/bin/hsplit\""
description = "split right, coupled to the tab's agent (hcouple)"

[[keys.command]]
key = "prefix+o"            # replaces open_notification_target, now unbound (hlast on prefix+a)
type = "shell"
command = "\"$HOME/.local/bin/hnvim\""
description = "nvim tab of this workspace"

[[keys.command]]
key = "prefix+tab"           # replaces cycle_pane_next
type = "plugin_action"
command = "thomas.last-tab.focus"
description = "toggle to the previously focused tab (last-tab plugin)"

[[keys.command]]
key = "prefix+percent"
type = "shell"
command = "\"$HOME/.local/bin/hflip\""
description = "toggle two panes between side by side and stacked (hflip)"

[[keys.command]]
key = "prefix+p"             # replaces previous_tab (alt+left), as tmux's prefix+p
type = "popup"
command = "GPG_TTY=$(tty) \"$HOME/.local/bin/open-pass\" copy"
description = "copy a pass entry's first line to the clipboard (open-pass)"
width = "80%"
height = "70%"

[[keys.command]]
key = "prefix+shift+p"       # replaces rename_pane (prefix+ctrl+p), as tmux's prefix+P
type = "popup"
command = "GPG_TTY=$(tty) \"$HOME/.local/bin/open-pass\" show"
description = "show a pass entry read-only in nvim (open-pass)"
width = "90%"
height = "85%"
