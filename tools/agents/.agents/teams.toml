# Which model runs each role, per team. agents-gen writes a role's
# definition for a harness only when that harness's team lists the role, so
# the ux-designer and the tooling agents exist for Claude only.
#
# Per team: name (shown in the roles' text), clear (the command that starts a
# fresh conversation), lead_start (how the human starts the lead).
# Per role: label (the model's name in the roles' text), and the header
# fields that harness's definition gets: Claude model/tools, OpenCode model,
# pi model/thinking.

[claude]
name = "Claude"
clear = "/clear"
lead_start = "`ha --host <repo>-lead --agent repo-lead`"

[claude.roles.repo-lead]
model = "opus"
label = "Opus"

[claude.roles.implementer]
model = "opus"
label = "Opus"

[claude.roles.reviewer]
model = "sonnet"
label = "Sonnet"

[claude.roles.debugger]
model = "sonnet"
label = "Sonnet"

[claude.roles.ux-designer]
model = "opus"
label = "Opus"

[claude.roles.setup-admin]
model = "opus"
label = "Opus"

[claude.roles.project-manager]
tools = "Read, Write, Edit, Bash, Glob, Grep"

[claude.roles.workflow-agent]
tools = "Read, Grep, Glob, Bash, WebFetch, WebSearch"

[opencode]
name = "OpenCode"
clear = "/new"
lead_start = "`hoc`"

[opencode.roles.repo-lead]
model = "opencode/gemini-4-hydrogen"
label = "Gemini 4 Hydrogen"

[opencode.roles.implementer]
model = "opencode-go/kimi-k3.1-pro"
label = "Kimi K3.1 Pro"

[opencode.roles.reviewer]
model = "opencode-go/glm-5.3"
label = "GLM-5.3"

[opencode.roles.debugger]
model = "opencode-go/glm-5.3"
label = "GLM-5.3"

# More teams for one harness: a table named <harness>-<id>. agents-gen writes
# them beside the harness's default team; for OpenCode into
# ~/.config/opencode/teams/<id>/, which `hoc --team <id>` links into a repo's
# .opencode/agents (overriding the global agents there) and `lead start`
# into each worker's worktree. A model may carry an effort variant after #.

# Trial, 2026-11-24: model comparison on the OpenCode harness, on the Go plan.
[opencode-go]
name = "OpenCode Go"
clear = "/new"
lead_start = "`hoc --team go`"

[opencode-go.roles.repo-lead]
model = "opencode-go/qwen4-max"
label = "Qwen4 Max"

[opencode-go.roles.implementer]
model = "opencode-go/hy4"
label = "Hy4"

[opencode-go.roles.reviewer]
model = "opencode-go/claude-haiku-5-5#high"
label = "Haiku 5.5"

[opencode-go.roles.debugger]
model = "opencode-go/claude-haiku-5-5#high"
label = "Haiku 5.5"

# Trial, 2026-11-24: the same comparison, all billed to the Zen
# pay-as-you-go workspace (vps-projects).
[opencode-zen]
name = "OpenCode Zen"
clear = "/new"
lead_start = "`hoc --team zen`"

[opencode-zen.roles.repo-lead]
model = "opencode/gemini-4-hydrogen#xhigh"
label = "Gemini 4 Hydrogen"

[opencode-zen.roles.implementer]
model = "opencode/claude-haiku-5-5#max"
label = "Haiku 5.5"

[opencode-zen.roles.reviewer]
model = "opencode/deepseek-v4.1-flash#max"
label = "DeepSeek V4.1 Flash"

[opencode-zen.roles.debugger]
model = "opencode/deepseek-v4.1-flash#max"
label = "DeepSeek V4.1 Flash"

# pi, the main driver since 2026-11-24, runs the same two trial teams as
# OpenCode. The default team is the Go one (`hpi`, all on the Go plan);
# `hpi --team zen` the Zen one (all on the Zen pay-as-you-go key, which pi
# needs as its `opencode` login). No thinking line: pi's default for that
# model. 2026-11-26: the Go teams' reviewer and debugger run Haiku 5.5 at
# high, not max. On the Go plan Haiku is among the cheapest models
# (cache reads $0.01 per million, $0.05 above 100k context; GLM-5.3
# $0.26), so its volume, not its price, was the problem: the review
# brakes in the roles address that.
[pi]
name = "pi Go"
clear = "/new"
lead_start = "`hpi`"

[pi.roles.repo-lead]
model = "opencode-go/qwen4-max"
label = "Qwen4 Max"

[pi.roles.implementer]
model = "opencode-go/hy4"
label = "Hy4"

[pi.roles.reviewer]
model = "opencode-go/claude-haiku-5-5"
thinking = "high"
label = "Haiku 5.5"

[pi.roles.debugger]
model = "opencode-go/claude-haiku-5-5"
thinking = "high"
label = "Haiku 5.5"

[pi-zen]
name = "pi Zen"
clear = "/new"
lead_start = "`hpi --team zen`"

[pi-zen.roles.repo-lead]
model = "opencode/gemini-4-hydrogen"
thinking = "xhigh"
label = "Gemini 4 Hydrogen"

[pi-zen.roles.implementer]
model = "opencode/claude-haiku-5-5"
thinking = "max"
label = "Haiku 5.5"

[pi-zen.roles.reviewer]
model = "opencode/deepseek-v4.1-flash"
thinking = "max"
label = "DeepSeek V4.1 Flash"

[pi-zen.roles.debugger]
model = "opencode/deepseek-v4.1-flash"
thinking = "max"
label = "DeepSeek V4.1 Flash"
