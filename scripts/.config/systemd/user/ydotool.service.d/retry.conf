# ydotoold (for dictate) starts with the user manager, a moment before logind
# grants the login session access to /dev/uinput, so its first tries fail with
# "Permission denied" and systemd gives up after five quick ones. Keep retrying
# every 3 s instead.
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=on-failure
RestartSec=3
