enable-ssh-support
# pinentry-tty writes the prompt as raw output on whatever pts the agent last
# learned and restores nothing, so a prompt landing in a pane that a TUI is
# taking over scrambles the display. pinentry-curses drives termios/termcap
# properly and repaints on exit. (pinentry-qt and -gnome3 are installed but
# currently broken: missing libKF6WindowSystem / libgcr-base-3.)
pinentry-program /usr/bin/pinentry-curses
# gpg-agent forks pinentry as its own child, not the tty's foreground process,
# so closing/killing the tmux pane hosting a prompt does NOT kill it: it
# orphans, keeps holding that pty (which tmux/the kernel can later hand to an
# unrelated pane), and keeps the agent's single pinentry slot locked — every
# later request just hangs with no visible prompt. This forces an abandoned
# prompt to self-cancel instead of hanging indefinitely.
pinentry-timeout 45
default-cache-ttl 7200 # time (s) to keep vault open
max-cache-ttl 14400 # max time (s) to keep vault open
default-cache-ttl-ssh 7200
max-cache-ttl-ssh 14400
log-file /home/thomas/.gnupg/gpg-agent.log
debug-level basic
verbose
